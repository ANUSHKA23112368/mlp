apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicshield-api
  labels:
    app.kubernetes.io/name: civicshield-api
    app.kubernetes.io/part-of: civicshield
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: civicshield-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civicshield-api
    spec:
      containers:
        - name: api
          image: civicshield/api:v3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: civicshield-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: civicshield-api-service
  labels:
    app.kubernetes.io/name: civicshield-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: civicshield-api
