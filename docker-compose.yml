version: "3.9"

# ─────────────────────────────────────────────────────────────────
# CivicShield AI — Docker Compose (local development)
# Usage: docker compose up --build
# ─────────────────────────────────────────────────────────────────

services:

  # ── FastAPI backend ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicshield_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://civicshield:civicshield@postgres:5432/civicshield
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - model_data:/app/models
    restart: unless-stopped

  # ── PostgreSQL 16 ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: civicshield_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: civicshield
      POSTGRES_PASSWORD: civicshield
      POSTGRES_DB: civicshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicshield -d civicshield"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: civicshield_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ── Streamlit dashboard (optional) ───────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicshield_dashboard
    command: ["python", "-m", "streamlit", "run", "app.py",
              "--server.port=8501", "--server.headless=true"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://civicshield:civicshield@postgres:5432/civicshield
    depends_on:
      - api
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  model_data:
